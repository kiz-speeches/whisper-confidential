name: Source and protocol checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with: {node-version: '24'}
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with: {go-version: '1.26.8', cache: false}
    - run: |
        node test-gpu-placeholder.cjs
        python3 -m unittest discover -s tests -p 'test_*.py' -v
        bash attestation/build.sh
    - name: Test gateway with fixed dependencies
      run: |
        docker run --rm -v "$PWD:/work" -w /work/attestation python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b bash -ec 'pip install --no-compile --only-binary=:all: --require-hashes -r requirements.lock; python -m unittest -v test_gateway'
