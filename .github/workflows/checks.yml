name: Source and protocol checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Test CPU and GPU boundaries with fixed dependencies
      run: |
        docker run --rm -v "$PWD:/work" -w /work python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b bash -ec 'pip install --no-compile --only-binary=:all: --require-hashes -r cpu/requirements.lock; sed -n "/^python-multipart==/p" gpu/requirements.lock > /tmp/gpu-test.lock; pip install --no-compile --only-binary=:all: --require-hashes -r /tmp/gpu-test.lock; python -m unittest discover -s tests -p "test_*.py" -v'
