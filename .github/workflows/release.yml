name: Build release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with: {fetch-depth: 0}
    - name: Rebuild twice and compare platform digests
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 tools/build.py --version "$RELEASE_VERSION" --repeat
    - name: Upload manifest and checksums
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-manifest
        path: |
          release/dist/release-manifest.json
          release/dist/SHA256SUMS
          release/dist/build-*/cpu-build.json
          release/dist/build-*/gpu-build.json
        if-no-files-found: error
    - name: Attach manifest to a private draft release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?",os.environ["RELEASE_VERSION"]), "Invalid release version"'
        gh release create "$RELEASE_VERSION" release/dist/release-manifest.json release/dist/SHA256SUMS \
          --draft --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file release/RELEASE-NOTES.md
