apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-gpu-prototype
  namespace: confidential-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper-gpu-prototype
  template:
    metadata:
      labels:
        app: whisper-gpu-prototype
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: sec1
      automountServiceAccountToken: false
      initContainers:
      - name: dependencies
        image: python:3.12-bookworm
        command: [bash, /app/bootstrap.sh]
        env:
        - {name: NVIDIA_VISIBLE_DEVICES, value: void}
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
        - {name: runtime, mountPath: /runtime}
      containers:
      - name: whisper
        image: python:3.12-bookworm
        command: [bash, /app/start.sh]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        env:
        - {name: OMP_NUM_THREADS, value: "2"}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
        resources:
          requests: {cpu: "2", memory: 4Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "4", memory: 8Gi, nvidia.com/gpu: "1"}
        ports:
        - {containerPort: 8080, name: http}
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
          failureThreshold: 120
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
        - {name: runtime, mountPath: /runtime}
      volumes:
      - name: app
        configMap:
          name: whisper-prototype-source
          items:
          - {key: app.py, path: app.py}
          - {key: requirements.txt, path: requirements.txt}
          - {key: bootstrap.sh, path: bootstrap.sh}
          - {key: start.sh, path: start.sh}
          - {key: index.html, path: static/index.html}
          - {key: client.js, path: static/client.js}
          - {key: style.css, path: static/style.css}
          - {key: pcm-worklet.js, path: static/pcm-worklet.js}
      - name: runtime
        emptyDir: {sizeLimit: 12Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-gpu-prototype
  namespace: confidential-inference
spec:
  selector: {app: whisper-gpu-prototype}
  ports:
  - {name: http, port: 8080, targetPort: http}
  type: ClusterIP
