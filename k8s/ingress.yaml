# CPU gateway exposure through the existing wildcard DNS and TLS certificate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-https
  namespace: confidential-inference
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-upload-limit
  namespace: confidential-inference
spec:
  buffering:
    # 64 MiB audio plus room for multipart headers. The app enforces 64 MiB audio.
    maxRequestBodyBytes: 68157440
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-concurrency
  namespace: confidential-inference
spec:
  inFlightReq:
    amount: 4
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-rate
  namespace: confidential-inference
spec:
  rateLimit:
    average: 120
    period: 1m
    burst: 30
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-gpu-prototype
  namespace: confidential-inference
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts: [whisper.speeches.dev]
  rules:
  - host: whisper.speeches.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whisper-cpu-gateway
            port: {number: 8080}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-attestation-limit
  namespace: confidential-inference
spec:
  buffering:
    maxRequestBodyBytes: 4096
    memRequestBodyBytes: 4096
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whisper-attestation-rate
  namespace: confidential-inference
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 8
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-cpu-attestation
  namespace: confidential-inference
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: confidential-inference-whisper-attestation-rate@kubernetescrd,confidential-inference-whisper-concurrency@kubernetescrd,confidential-inference-whisper-attestation-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [whisper.speeches.dev]
  rules:
  - host: whisper.speeches.dev
    http:
      paths:
      - path: /v1/attestation
        pathType: Exact
        backend:
          service:
            name: whisper-cpu-gateway
            port: {number: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-gpu-prototype-audio
  namespace: confidential-inference
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: confidential-inference-whisper-rate@kubernetescrd,confidential-inference-whisper-concurrency@kubernetescrd,confidential-inference-whisper-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [whisper.speeches.dev]
  rules:
  - host: whisper.speeches.dev
    http:
      paths:
      - path: /v1/audio/transcriptions
        pathType: Prefix
        backend:
          service:
            name: whisper-cpu-gateway
            port: {number: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-gpu-prototype-http
  namespace: confidential-inference
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: confidential-inference-whisper-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: whisper.speeches.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whisper-cpu-gateway
            port: {number: 8080}
